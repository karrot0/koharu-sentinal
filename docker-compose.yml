services:
  koharu-sentinal:
    build: .
    image: koharu-sentinal:latest
    container_name: koharu-sentinal
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
